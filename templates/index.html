<!DOCTYPE html>
<html>
<head>
  <title>MindCare</title>

<style>

/* ===== BASE ===== */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;

  /* 🔥 Animated Premium Background */
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  background-size: 400% 400%;
  animation: gradientMove 12s ease infinite;
}

/* background animation */
@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* glow overlay */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08), transparent),
              radial-gradient(circle at 80% 70%, rgba(255,255,255,0.05), transparent);
  pointer-events: none;
}

/* ===== MAIN CARD ===== */
.container {
  text-align: center;
  padding: 50px;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  animation: fadeIn 0.8s ease;
}

/* entry animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== TEXT ===== */
.title {
  font-size: 40px;
  margin-bottom: 10px;
}

.subtitle {
  opacity: 0.8;
  margin-bottom: 30px;
}

#questionText {
  font-size: 26px;
  margin: 20px 0;
}

#progress {
  opacity: 0.7;
}

/* ===== BUTTON GROUP ===== */
.btn-group button,
.option-btn,
.result-btn {
  padding: 12px 22px;
  margin: 10px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-size: 15px;
  background: white;
  transition: all 0.3s ease;
}

/* hover effect */
.btn-group button:hover,
.option-btn:hover,
.result-btn:hover {
  transform: translateY(-3px) scale(1.05);
  background: black;
  color: white;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
}

/* ===== RESULT BOX ===== */
#resultBox {
  max-width: 600px;
  margin: auto;
}

/* ===== APP LOGIC (DO NOT REMOVE) ===== */
#questionBox,
#resultBox {
  display: none;
}

</style>
</head>

<body>

<!-- START -->
<div class="box" id="startBox">
  <div class="container">
    <h1 class="title">MindCare</h1>
    <p class="subtitle">Understand your mental state</p>

    <div class="btn-group">
      <button onclick="startQuick()">Quick Check</button>
      <button onclick="startDeep()">Deep Assessment</button>
    </div>
  </div>
</div>

<!-- QUESTION -->
<div class="box" id="questionBox">
  <p id="progress"></p>
  <h2 id="questionText"></h2>
  <div id="options"></div>
</div>

<!-- RESULT -->
<div class="box" id="resultBox">
  <div class="container" id="resultContent"></div>
</div>



<div class="box" id="gameBox" style="display:none">

    <button onclick="startBreathing()">Breathing Exercise</button>
    <button onclick="startSound('rain')">Rain Sound</button>
    <button onclick="startSound('calm')">Calm Music</button>
  </div>

  <!-- GAME AREA -->

  <!-- SCORE -->
  <p id="scoreText"></p>

  <br>
  <button onclick="exitGame()">Back</button>

/* ================= START FUNCTIONS ================= */
function startQuick() {
  mode = "quick";

  resetAll();
  document.getElementById("questionBox").style.opacity = 0;

  setTimeout(() => {
    document.getElementById("questionBox").style.transition = "0.5s";
    document.getElementById("questionBox").style.opacity = 1;
  }, 100);
  // 🔥 reset deep counter so it doesn't affect quick
  questionCount = 0;

  nextQuestion();   // start random questions
}

function startDeep() {
  mode = "deep";
  resetAll();
  document.getElementById("questionBox").style.opacity = 0;

  setTimeout(() => {
    document.getElementById("questionBox").style.transition = "0.5s";
    document.getElementById("questionBox").style.opacity = 1;
  }, 100);
  currentNode = deepTree;
  render(currentNode, "Deep Mode");
}

/* ================= RESET ================= */
function resetAll() {
  userProfile = { stress: 0, anxiety: 0, sleep: 0 };
  asked = [];

  document.getElementById("startBox").style.display = "none";
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("questionBox").style.display = "block";
}

/* ================= QUICK ENGINE ================= */
function nextQuestion() {

  // 🔥 LIMIT QUICK QUESTIONS
  if (asked.length >= maxQ) {
    showResult();
    return;
  }

  let available = questionBank.filter(q => !asked.includes(q.id));

  if (available.length === 0) {
    showResult();
    return;
  }

  let q = available[Math.floor(Math.random() * available.length)];

  asked.push(q.id);
  render(q, `Question ${asked.length} of ${maxQ}`);
}


/* ================= RENDER ================= */
function render(q, progressText = "") {
  document.getElementById("questionText").innerText = q.text;
  document.getElementById("progress").innerText = progressText;

  let btns = "";
  q.options.forEach((opt, i) => {
    btns += `<button class="option-btn" onclick="handleOption(${i})">${opt.text}</button>`;
  });

  window.currentOptions = q.options;
  document.getElementById("options").innerHTML = btns;
}

/* ================= CLICK ================= */
function handleOption(i) {
  let opt = window.currentOptions[i];

  if (!opt) return;

  if (opt.effect) {
    for (let k in opt.effect) {
      userProfile[k] += opt.effect[k];
    }
  }

  // 🔥 DIFFERENT LOGIC FOR MODES
  if (mode === "deep") {

    questionCount++;

    if (questionCount >= maxQuestions) {
      showResult();
      return;
    }

    if (opt.next && deepNodes[opt.next]) {
      currentNode = deepNodes[opt.next];
      render(currentNode, "Deep Assessment");
    } else {
      showResult();
    }

  } else if (mode === "quick") {

    // ❗ DO NOT USE questionCount HERE
    nextQuestion();   // your quick random function

  }
}

/* ================= RESULT ================= */
function showResult() {
  document.getElementById("questionBox").style.display = "none";
  document.getElementById("resultBox").style.display = "block";

  let stress = userProfile.stress;
  let anxiety = userProfile.anxiety;
  let sleep = -userProfile.sleep;

  // Normalize
  let totalQuestions = questionCount || 1; // safety
  let normStress = stress / totalQuestions;
  let normAnxiety = anxiety / totalQuestions;
  let normSleep = sleep / totalQuestions;

  let max = Math.max(normStress, normAnxiety, normSleep);

  let result = "";
  let solution = "";
  let gameBtn = ""; // 🔥 NEW

  /* ===== SEVERE ===== */
  if (max >= 1.5) {
    if (max === normAnxiety) {
      result = "High Anxiety";
      solution = "Practice breathing, reduce overthinking triggers, and consider talking to someone.";
    }
    else if (max === normStress) {
      result = "Severe Stress";
      solution = "Reduce workload, take breaks, and prioritize recovery.";
    }
    else {
      result = "Severe Sleep Issue";
      solution = "Fix sleep schedule, avoid screens, and improve sleep hygiene.";
    }

    // 🔥 SHOW GAME BUTTON ONLY IN SEVERE
    gameBtn = `<button class="result-btn" onclick="startGame()">Play Relaxing Game</button>`;
  }

  /* ===== MODERATE ===== */
  else if (max >= 0.8) {
    if (max === normAnxiety) {
      result = "Overthinking Pattern";
      solution = "Try journaling and logical thinking techniques.";
    }
    else if (max === normStress) {
      result = "Moderate Stress";
      solution = "Take breaks and manage workload.";
    }
    else {
      result = "Sleep Disturbance";
      solution = "Improve bedtime routine.";
    }
  }

  /* ===== LOW ===== */
  else {
    result = "Balanced Mind";
    solution = "Keep maintaining your current habits.";
  }

  // 🔥 FINAL OUTPUT (updated)
  document.getElementById("resultContent").innerHTML = `
    <h2>${result}</h2>
    <p>${solution}</p>

    ${gameBtn}

    <br><br>
    <button class="result-btn" onclick="location.reload()">Restart</button>
  `;
}


function getNextCategory() {
  if (userProfile.stress > userProfile.anxiety && userProfile.stress > -userProfile.sleep) {
    return "stress";
  }
  else if (userProfile.anxiety > -userProfile.sleep) {
    return "anxiety";
  }
  else {
    return "sleep";
  }
}

/* start game */
function startGame() {
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("gameBox").style.display = "block";

  document.getElementById("gameArea").innerHTML = "";
  document.getElementById("scoreText").innerText = "";
}



/* bubble game */

let score = 0;

function startBubble() {
  let area = document.getElementById("gameArea");
  area.innerHTML = "";
  score = 0;

  document.getElementById("scoreText").innerText = "Score: 0";

  for (let i = 0; i < 20; i++) {
    let bubble = document.createElement("div");

    bubble.style.width = "40px";
    bubble.style.height = "40px";
    bubble.style.borderRadius = "50%";
    bubble.style.background = "rgba(255,255,255,0.7)";
    bubble.style.position = "absolute";
    bubble.style.left = Math.random() * 90 + "%";
    bubble.style.top = Math.random() * 80 + "%";
    bubble.style.cursor = "pointer";

    bubble.onclick = function () {
      bubble.remove();
      score++;
      document.getElementById("scoreText").innerText = "Score: " + score;
    };

    area.appendChild(bubble);
  }
}

/* Breathing */
function startBreathing() {
  let area = document.getElementById("gameArea");
  area.innerHTML = "";

  let circle = document.createElement("div");

  circle.style.width = "100px";
  circle.style.height = "100px";
  circle.style.borderRadius = "50%";
  circle.style.background = "rgba(255,255,255,0.5)";
  circle.style.margin = "auto";
  circle.style.transition = "all 4s ease";

  area.appendChild(circle);

  let text = document.createElement("h3");
  text.innerText = "Breathe In";
  area.appendChild(text);

  let inhale = true;

  setInterval(() => {
    if (inhale) {
      circle.style.transform = "scale(2)";
      text.innerText = "Breathe In";
    } else {
      circle.style.transform = "scale(1)";
      text.innerText = "Breathe Out";
    }
    inhale = !inhale;
  }, 4000);
}

/* Sounds */
let audio = null;

function startSound(type) {
  let area = document.getElementById("gameArea");
  area.innerHTML = "<h3>Playing...</h3>";

  if (audio) audio.pause();

  if (type === "rain") {
    audio = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
  } else {
    audio = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3");
  }

  audio.loop = true;
  audio.play();
}

/* Exit */
function exitGame() {
  document.getElementById("gameBox").style.display = "none";
  document.getElementById("resultBox").style.display = "block";

  if (audio) audio.pause();
}
